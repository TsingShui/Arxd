apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.arxdrxd'
version = '0.1.0'

def appRoot = rootProject.projectDir.parentFile
def nativeRoot = new File(appRoot, 'target/arxd')

android {
  namespace 'expo.modules.arxdrxd'
  defaultConfig {
    minSdkVersion 26
  }
  sourceSets {
    main {
      jniLibs.srcDirs += new File(nativeRoot, 'native')
      assets.srcDirs += new File(nativeRoot, 'native-metadata')
      assets.srcDirs += new File(nativeRoot, 'preload/assets')
      assets.srcDirs += new File(appRoot, 'native/services')
    }
  }
}

tasks.named('preBuild').configure {
  doFirst {
    if (!new File(nativeRoot, 'native/arm64-v8a/librxd.so').isFile()) {
      throw new GradleException('Build the real rxd executable first: npm run build:rxd')
    }
    if (!new File(nativeRoot, 'native/arm64-v8a/libarxdpreload.so').isFile() ||
        !new File(nativeRoot, 'preload/assets/termux-bootstrap.zip').isFile() ||
        !new File(nativeRoot, 'preload/assets/termux-runtime-packages.zip').isFile() ||
        !new File(nativeRoot, 'preload/assets/termux-runtime-packages.json').isFile() ||
        !new File(nativeRoot, 'preload/assets/termux-toolchain-probe.sh').isFile()) {
      throw new GradleException('Build the pinned preload environment first: python3 scripts/build-preload.py')
    }
  }
}

// Match the pinned React Native 0.88 HTTP stack; no platform trust overrides.
dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
