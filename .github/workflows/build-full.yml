name: Build Full signed APK

on:
  workflow_dispatch:
    inputs:
      engine_run:
        description: 'Reuse the verified engine artifact from a previous Full run (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-full-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  engine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - name: Check out App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned engine source revision
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('prebuilt/rxd/arm64-v8a/manifest.json').read_text())
          revision = pin.get('sourceBuildRevision', pin['sourceRevision'])
          assert re.fullmatch('[0-9a-f]{40}', revision) and not pin['sourceDirty']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PY

      - name: Check out the pinned private RxD source
        if: inputs.engine_run == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TsingShui/RxD
          ref: ${{ steps.pin.outputs.revision }}
          path: target/rxd-source
          fetch-depth: 0
          submodules: recursive
          ssh-key: ${{ secrets.RXD_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Set up .NET SDK 10
        if: inputs.engine_run == ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Android SDK
        if: inputs.engine_run == ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install the pinned Rust and NDK toolchains
        if: inputs.engine_run == ''
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add aarch64-linux-android
          sdkmanager --install 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build complete Android Bionic engine without executing it
        if: inputs.engine_run == ''
        working-directory: target/rxd-source
        run: |
          python3 scripts/build-ilspy.py linux-bionic-arm64
          python3 scripts/build-bundled.py --target aarch64-linux-android --jobs 2 --features mcp,bundled-ilspy

      - name: Bind the actual engine bytes to the pinned source
        if: inputs.engine_run == ''
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          source = Path('target/rxd-source')
          pin = json.loads(Path('prebuilt/rxd/arm64-v8a/manifest.json').read_text())
          revision = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == pin.get('sourceBuildRevision', pin['sourceRevision'])
          assert not subprocess.check_output(['git', '-C', str(source), 'status', '--porcelain', '--untracked-files=no'])
          binary = source / 'target/aarch64-linux-android/release/rxd'
          digest = hashlib.sha256()
          with binary.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1048576), b''):
                  digest.update(chunk)
          manifest = dict(pin, sourceRevision=revision, binarySha256=digest.hexdigest(), binaryBytes=binary.stat().st_size,
                          binaryUrl=None, manifestUrl=None, builtFromSource=True, executionVerified=False)
          output = Path('target/arxd/ci-rxd')
          output.mkdir(parents=True, exist_ok=True)
          shutil.copy2(binary, output / 'librxd.so')
          (output / 'rxd-build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({'sourceRevision': revision, 'binarySha256': manifest['binarySha256'],
                            'binaryBytes': manifest['binaryBytes']}))
          PY

      - name: Reuse a previously built engine
        if: inputs.engine_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.engine_run }}
          pattern: arxd-full-engine-*
          merge-multiple: true
          path: target/arxd/ci-rxd

      - name: Verify reused engine identity
        if: inputs.engine_run != ''
        env:
          EXPECTED_REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('target/arxd/ci-rxd')
          manifest = json.loads((root / 'rxd-build.json').read_text())
          pin = json.loads(Path('prebuilt/rxd/arm64-v8a/manifest.json').read_text())
          assert manifest['sourceRevision'] == os.environ['EXPECTED_REVISION']
          assert manifest['target'] == 'aarch64-linux-android' and manifest['builtFromSource']
          assert set(pin['features']) <= set(manifest['features'])
          binary = root / 'librxd.so'
          assert binary.stat().st_size == manifest['binaryBytes']
          digest = hashlib.sha256()
          with binary.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1048576), b''):
                  digest.update(chunk)
          assert digest.hexdigest() == manifest['binarySha256']
          print('Reusing matching complete engine:', digest.hexdigest())
          PY

      - name: Upload engine build input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arxd-full-engine-${{ github.sha }}
          path: target/arxd/ci-rxd/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      ARXD_ENABLE_VERIFICATION: '0'
      ARXD_ANDROID_APPLICATION_ID: ''
      RXD_BINARY: ${{ github.workspace }}/target/arxd/ci-rxd/librxd.so
      RXD_MANIFEST: ${{ github.workspace }}/target/arxd/ci-rxd/rxd-build.json
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the complete engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arxd-full-engine-${{ github.sha }}
          path: target/arxd/ci-rxd

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android toolchain
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
          command -v gpgv

      - name: Install dependencies and check source
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Cache authenticated runtime downloads
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/arxd/preload/downloads
          key: termux-runtime-${{ runner.os }}-${{ hashFiles('native/preload/bootstrap.json', 'native/preload/runtime-packages.json', 'native/preload/ecapture.json', 'native/preload/tools/**') }}

      - name: Build pinned shell runtime
        run: python3 scripts/build-preload.py

      - name: Save verified runtime downloads before APK packaging
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/arxd/preload/downloads
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Sign and build Full APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ARXD_RELEASE_KEYSTORE_BASE64 }}
          ARXD_RELEASE_STORE_PASSWORD: ${{ secrets.ARXD_RELEASE_STORE_PASSWORD }}
          ARXD_RELEASE_KEY_ALIAS: ${{ secrets.ARXD_RELEASE_KEY_ALIAS }}
          ARXD_RELEASE_KEY_PASSWORD: ${{ secrets.ARXD_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing keystore secret}"
          : "${ARXD_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${ARXD_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${ARXD_RELEASE_KEY_PASSWORD:?Missing key password}"
          umask 077
          export ARXD_RELEASE_STORE_FILE="$RUNNER_TEMP/arxd-release.p12"
          trap 'rm -f "$ARXD_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ARXD_RELEASE_STORE_FILE"
          npm run build:release -- --variant full
          version=$(node -p 'require("./package.json").version')
          python3 scripts/verify-lite-release.py --variant full \
            --apk "target/arxd/release/arxd-full-${version}-arm64-v8a.apk" \
            --keystore "$ARXD_RELEASE_STORE_FILE" --alias "$ARXD_RELEASE_KEY_ALIAS" \
            > target/arxd/release/verification.json
          cd target/arxd/release
          sha256sum --check SHA256SUMS

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/arxd-release.p12"

      - name: Upload signed Full APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arxd-full-${{ github.sha }}
          path: |
            target/arxd/release/arxd-full-*-arm64-v8a.apk
            target/arxd/release/SHA256SUMS
            target/arxd/release/release.json
            target/arxd/release/verification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
