name: Build Lite release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Signing is never exposed to pull requests or manual feature-branch runs.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      ARXD_ENABLE_VERIFICATION: '0'
      ARXD_ANDROID_APPLICATION_ID: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Validate release version and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"), a=require("./app.json").expo; if(p.version!==a.version) throw new Error("App versions differ"); if(process.env.GITHUB_REF_TYPE==="tag" && process.env.RELEASE_TAG!==`v${p.version}`) throw new Error("Tag must match the app version");'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android toolchain
        run: |
          sdkmanager --install \
            'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
          command -v gpgv

      - name: Install dependencies
        run: npm ci

      - name: Check source and build routing
        run: |
          npm run lint
          npm run typecheck
          node --test tests/build-release.test.mjs
          python3 -m unittest discover -s tests -p 'test_lite_release.py'

      - name: Build pinned shell runtime
        run: python3 scripts/build-preload.py

      - name: Sign, build and verify Lite APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ARXD_RELEASE_KEYSTORE_BASE64 }}
          ARXD_RELEASE_STORE_PASSWORD: ${{ secrets.ARXD_RELEASE_STORE_PASSWORD }}
          ARXD_RELEASE_KEY_ALIAS: ${{ secrets.ARXD_RELEASE_KEY_ALIAS }}
          ARXD_RELEASE_KEY_PASSWORD: ${{ secrets.ARXD_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing keystore secret}"
          : "${ARXD_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${ARXD_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${ARXD_RELEASE_KEY_PASSWORD:?Missing key password}"
          umask 077
          export ARXD_RELEASE_STORE_FILE="$RUNNER_TEMP/arxd-release.p12"
          trap 'rm -f "$ARXD_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ARXD_RELEASE_STORE_FILE"
          npm run build:release:lite
          version=$(node -p 'require("./package.json").version')
          python3 scripts/verify-lite-release.py \
            --apk "target/arxd/release/arxd-lite-${version}-arm64-v8a.apk" \
            --keystore "$ARXD_RELEASE_STORE_FILE" \
            --alias "$ARXD_RELEASE_KEY_ALIAS" \
            > target/arxd/release/verification.json
          cd target/arxd/release
          sha256sum --check SHA256SUMS

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/arxd-release.p12"

      - name: Upload verified Lite artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arxd-lite-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            target/arxd/release/arxd-lite-*-arm64-v8a.apk
            target/arxd/release/SHA256SUMS
            target/arxd/release/release.json
            target/arxd/release/verification.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Lite artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arxd-lite-${{ github.sha }}
          path: target/arxd/release

      - name: Publish Lite release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd target/arxd/release
          sha256sum --check SHA256SUMS
          args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            arxd-lite-*-arm64-v8a.apk SHA256SUMS release.json verification.json
